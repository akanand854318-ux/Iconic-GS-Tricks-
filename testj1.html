<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geography Special Test - Iconic GS Tricks</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-10">

    <header class="bg-indigo-900 text-white shadow-md p-4 sticky top-0 z-50">
        <div class="max-w-xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold">Iconic GS Tricks</h1>
                <p class="text-xs text-amber-300">भूगोल (Geography) - मॉक टेस्ट</p>
            </div>
            <a href="index.html" class="bg-indigo-800 hover:bg-indigo-700 text-xs px-3 py-1.5 rounded-lg border border-indigo-600 flex items-center">
                <i class="fa-solid fa-house mr-1"></i> होमपेज
            </a>
        </div>
    </header>

    <div class="max-w-xl mx-auto p-4">
        <!-- Registration Screen -->
        <div id="reg-screen" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mt-4">
            <h2 class="text-xl font-bold text-slate-900 text-center mb-4">भूगोल टेस्ट पंजीकरण</h2>
            <form id="reg-form" onsubmit="startQuiz(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">पूरा नाम *</label>
                    <input type="text" id="std-name" required placeholder="अपना नाम दर्ज करें" class="w-full px-3 py-2 text-sm rounded-xl border border-slate-300">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 text-sm rounded-xl shadow-md">
                    टेस्ट शुरू करें
                </button>
            </form>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="hidden space-y-4 mt-2">
            <div class="bg-white p-4 rounded-xl border shadow-sm flex justify-between items-center">
                <span id="q-counter" class="text-xs font-bold text-indigo-700">प्रश्न 1</span>
                <span id="timer" class="text-xs font-bold text-rose-600">30:00</span>
            </div>
            <div class="bg-white p-5 rounded-2xl border shadow-sm space-y-4">
                <h3 id="question-text" class="font-bold text-slate-900 text-base">प्रश्न</h3>
                <div id="options-container" class="space-y-2.5"></div>
                <div id="explanation-box" class="hidden bg-amber-50 border p-4 rounded-xl text-xs text-amber-900">
                    <div class="font-bold mb-1">व्याख्या:</div>
                    <div id="explanation-text">--</div>
                </div>
            </div>
            <div class="flex justify-between gap-3">
                <button type="button" onclick="prevQuestion()" class="flex-1 bg-slate-200 py-2.5 text-xs rounded-xl font-bold">पिछला</button>
                <button type="button" onclick="nextQuestion()" class="flex-1 bg-indigo-600 text-white py-2.5 text-xs rounded-xl font-bold">अगला</button>
            </div>
            <button type="button" onclick="submitQuiz()" class="w-full bg-emerald-600 text-white font-bold py-3 text-sm rounded-xl mt-4">टेस्ट समाप्त करें</button>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="hidden bg-white p-6 rounded-2xl border text-center mt-4 space-y-4">
            <h2 class="text-2xl font-bold">टेस्ट परिणाम</h2>
            <p id="res-score" class="text-lg font-extrabold text-emerald-700">0 / 5</p>
            <a id="share-wa-btn" href="#" target="_blank" class="block w-full bg-emerald-600 text-white font-bold py-3 text-xs rounded-xl">
                <i class="fa-brands fa-whatsapp"></i> व्हाट्सएप पर शेयर करें
            </a>
            <a href="index.html" class="block w-full bg-slate-700 text-white font-bold py-3 text-xs rounded-xl">होमपेज पर जाएं</a>
        </div>
    </div>

    <script src="Questionsj1.js"></script>
    <script>
        let currentQ = 0;
        let userAnswers = {};
        let studentInfo = {};
        let isSubmitted = false;

        function startQuiz(e) {
            e.preventDefault();
            if (typeof quizDataGeography === 'undefined') {
                alert("Questionsj1.js लोड नहीं हुई!");
                return;
            }
            studentInfo.name = document.getElementById('std-name').value;
            document.getElementById('reg-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            let q = quizDataGeography[currentQ];
            document.getElementById('q-counter').innerText = `प्रश्न ${currentQ + 1} / ${quizDataGeography.length}`;
            document.getElementById('question-text').innerText = q.q;

            let optHTML = '';
            q.options.forEach((opt, idx) => {
                let bg = (userAnswers[currentQ] === idx) ? 'bg-indigo-100 border-indigo-500' : 'bg-slate-50 border-slate-200';
                optHTML += `<button onclick="selectOption(${idx})" class="w-full text-left p-3 rounded-xl border text-sm ${bg}">${opt}</button>`;
            });
            document.getElementById('options-container').innerHTML = optHTML;

            let expBox = document.getElementById('explanation-box');
            if (userAnswers[currentQ] !== undefined || isSubmitted) {
                document.getElementById('explanation-text').innerHTML = q.exp;
                expBox.classList.remove('hidden');
            } else {
                expBox.classList.add('hidden');
            }
        }

        function selectOption(idx) {
            if(isSubmitted) return;
            userAnswers[currentQ] = idx;
            loadQuestion();
        }

        function nextQuestion() {
            if (currentQ < quizDataGeography.length - 1) { currentQ++; loadQuestion(); }
        }
        function prevQuestion() {
            if (currentQ > 0) { currentQ--; loadQuestion(); }
        }

        function submitQuiz() {
            isSubmitted = true;
            let score = 0;
            quizDataGeography.forEach((q, idx) => {
                if (userAnswers[idx] === q.ans) score++;
            });

            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('res-score').innerText = `${score} / ${quizDataGeography.length}`;

            let msg = `🎯 *Geography Test Result*\n👤 ${studentInfo.name}\n📊 Score: ${score}/${quizDataGeography.length}\nhttps://akanand854318-ux.github.io/`;
            document.getElementById('share-wa-btn').href = `https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`;
        }
    </script>
</body>
</html>
