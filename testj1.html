<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>विश्व भूगोल (World Geography) - Iconic GS Tricks</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-10">

    <!-- Header Banner -->
    <header class="bg-indigo-900 text-white shadow-md p-4 sticky top-0 z-50">
        <div class="max-w-xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold">Iconic GS Tricks</h1>
                <p class="text-xs text-amber-300">विश्व भूगोल (World Geography) - मॉक टेस्ट 1</p>
            </div>
            <a href="index.html" class="bg-indigo-800 hover:bg-indigo-700 text-xs px-3 py-1.5 rounded-lg border border-indigo-600 flex items-center">
                <i class="fa-solid fa-house mr-1.5"></i> होमपेज
            </a>
        </div>
    </header>

    <div class="max-w-xl mx-auto p-4">
        
        <!-- Registration Screen (जैसा पहले फोटो में है) -->
        <div id="reg-screen" class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 mt-2 text-center space-y-4">
            
            <!-- User Icon Avatar -->
            <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto text-2xl shadow-inner">
                <i class="fa-solid fa-user-pen"></i>
            </div>

            <div>
                <h2 class="text-2xl font-black text-slate-900 tracking-tight">परीक्षार्थी पंजीकरण</h2>
                <p class="text-xs text-slate-500 font-medium mt-1">100 प्रश्न | समय: 60 मिनट | Instant Explanation Test</p>
            </div>

            <form id="reg-form" onsubmit="startQuiz(event)" class="space-y-3.5 text-left pt-2">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">छात्र / छात्रा का पूरा नाम *</label>
                    <input type="text" id="std-name" required placeholder="अपना पूरा नाम दर्ज करें" class="w-full px-4 py-2.5 text-sm rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-slate-50/50">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">राज्य (State) *</label>
                    <select id="std-state" required class="w-full px-4 py-2.5 text-sm rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-slate-50/50">
                        <option value="बिहार (Bihar)">बिहार (Bihar)</option>
                        <option value="उत्तर प्रदेश (Uttar Pradesh)">उत्तर प्रदेश (Uttar Pradesh)</option>
                        <option value="झारखंड (Jharkhand)">झारखंड (Jharkhand)</option>
                        <option value="मध्य प्रदेश (Madhya Pradesh)">मध्य प्रदेश (Madhya Pradesh)</option>
                        <option value="राजस्थान (Rajasthan)">राजस्थान (Rajasthan)</option>
                        <option value="अन्य (Other)">अन्य (Other)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">जिला (District) *</label>
                    <input type="text" id="std-district" required placeholder="अपना जिला दर्ज करें (जैसे: अररिया)" class="w-full px-4 py-2.5 text-sm rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-slate-50/50">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">गाँव / शहर *</label>
                    <input type="text" id="std-village" required placeholder="गाँव या शहर का नाम दर्ज करें" class="w-full px-4 py-2.5 text-sm rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-slate-50/50">
                </div>

                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 text-sm rounded-2xl shadow-lg shadow-indigo-200 flex items-center justify-center gap-2 transition active:scale-98 mt-2">
                    <i class="fa-solid fa-play text-xs"></i> टेस्ट शुरू करें (100 Questions)
                </button>
            </form>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="hidden space-y-4 mt-2">
            <div class="bg-white p-4 rounded-xl border shadow-sm flex justify-between items-center">
                <span id="q-counter" class="text-xs font-bold text-indigo-700">प्रश्न 1 / 100</span>
                <span id="timer" class="text-xs font-bold text-rose-600"><i class="fa-solid fa-clock mr-1"></i>60:00</span>
            </div>
            
            <div class="bg-white p-5 rounded-2xl border shadow-sm space-y-4">
                <h3 id="question-text" class="font-bold text-slate-900 text-base leading-relaxed">प्रश्न लोड हो रहा है...</h3>
                <div id="options-container" class="space-y-2.5"></div>
                
                <div id="explanation-box" class="hidden bg-amber-50 border border-amber-200 p-4 rounded-xl text-xs text-amber-900 space-y-1">
                    <div class="font-bold text-amber-900 flex items-center gap-1.5">
                        <i class="fa-solid fa-lightbulb text-amber-600"></i> उत्तर व्याख्या:
                    </div>
                    <div id="explanation-text" class="leading-relaxed">--</div>
                </div>
            </div>

            <div class="flex justify-between gap-3">
                <button type="button" onclick="prevQuestion()" class="flex-1 bg-slate-200 hover:bg-slate-300 py-3 text-xs rounded-xl font-bold transition">पिछला</button>
                <button type="button" onclick="nextQuestion()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-3 text-xs rounded-xl font-bold transition">अगला</button>
            </div>
            
            <button type="button" onclick="submitQuiz()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 text-sm rounded-xl shadow-md transition active:scale-95">
                <i class="fa-solid fa-check-double mr-1.5"></i> टेस्ट समाप्त करें
            </button>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="hidden bg-white p-6 rounded-2xl border text-center mt-4 space-y-4 shadow-sm">
            <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-3xl">
                <i class="fa-solid fa-trophy"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-900">टेस्ट परिणाम</h2>
            <p id="res-score" class="text-3xl font-black text-emerald-600">0 / 100</p>
            <p id="res-details" class="text-xs text-slate-500"></p>

            <a id="share-wa-btn" href="#" target="_blank" class="block w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 text-xs rounded-xl shadow-sm transition">
                <i class="fa-brands fa-whatsapp text-sm mr-1"></i> व्हाट्सएप पर शेयर करें
            </a>
            <a href="index.html" class="block w-full bg-slate-700 hover:bg-slate-800 text-white font-bold py-3 text-xs rounded-xl transition">
                होमपेज पर जाएं
            </a>
        </div>
    </div>

    <!-- Linked Questions File -->
    <script src="Questionsj1.js"></script>
    <script>
        let currentQ = 0;
        let userAnswers = {};
        let studentInfo = {};
        let isSubmitted = false;
        let timerInterval;
        let totalSeconds = 3600; // 60 minutes

        function startQuiz(e) {
            e.preventDefault();
            
            let data = typeof quizDataGeography100 !== 'undefined' ? quizDataGeography100 : (typeof quizDataGeography !== 'undefined' ? quizDataGeography : null);
            
            if (!data) {
                alert("Questionsj1.js फ़ाइल लोड नहीं हो सकी! कृपया चेक करें।");
                return;
            }

            studentInfo.name = document.getElementById('std-name').value;
            studentInfo.state = document.getElementById('std-state').value;
            studentInfo.district = document.getElementById('std-district').value;
            studentInfo.village = document.getElementById('std-village').value;

            document.getElementById('reg-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            
            startTimer();
            loadQuestion();
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                if (totalSeconds <= 0) {
                    clearInterval(timerInterval);
                    submitQuiz();
                    return;
                }
                totalSeconds--;
                let mins = Math.floor(totalSeconds / 60);
                let secs = totalSeconds % 60;
                document.getElementById('timer').innerHTML = `<i class="fa-solid fa-clock mr-1"></i>${mins}:${secs < 10 ? '0' : ''}${secs}`;
            }, 1000);
        }

        function loadQuestion() {
            let data = typeof quizDataGeography100 !== 'undefined' ? quizDataGeography100 : quizDataGeography;
            let q = data[currentQ];
            
            document.getElementById('q-counter').innerText = `प्रश्न ${currentQ + 1} / ${data.length}`;
            document.getElementById('question-text').innerText = `${currentQ + 1}. ${q.q}`;

            let optHTML = '';
            q.options.forEach((opt, idx) => {
                let bg = (userAnswers[currentQ] === idx) ? 'bg-indigo-100 border-indigo-500 font-bold text-indigo-900' : 'bg-slate-50 border-slate-200 hover:bg-slate-100';
                optHTML += `<button onclick="selectOption(${idx})" class="w-full text-left p-3.5 rounded-xl border text-xs sm:text-sm transition ${bg}">${opt}</button>`;
            });
            document.getElementById('options-container').innerHTML = optHTML;

            let expBox = document.getElementById('explanation-box');
            if (userAnswers[currentQ] !== undefined || isSubmitted) {
                document.getElementById('explanation-text').innerHTML = q.exp;
                expBox.classList.remove('hidden');
            } else {
                expBox.classList.add('hidden');
            }
        }

        function selectOption(idx) {
            if(isSubmitted) return;
            userAnswers[currentQ] = idx;
            loadQuestion();
        }

        function nextQuestion() {
            let data = typeof quizDataGeography100 !== 'undefined' ? quizDataGeography100 : quizDataGeography;
            if (currentQ < data.length - 1) { currentQ++; loadQuestion(); }
        }
        function prevQuestion() {
            if (currentQ > 0) { currentQ--; loadQuestion(); }
        }

        function submitQuiz() {
            clearInterval(timerInterval);
            isSubmitted = true;
            let score = 0;
            let data = typeof quizDataGeography100 !== 'undefined' ? quizDataGeography100 : quizDataGeography;
            
            data.forEach((q, idx) => {
                if (userAnswers[idx] === q.ans) score++;
            });

            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('res-score').innerText = `${score} / ${data.length}`;
            document.getElementById('res-details').innerText = `परीक्षार्थी: ${studentInfo.name} | स्थान: ${studentInfo.district}, ${studentInfo.state}`;

            let msg = `🎯 *Iconic GS Tricks - Geography Test Result*\n👤 नाम: ${studentInfo.name}\n📍 स्थान: ${studentInfo.district}, ${studentInfo.state}\n📊 स्कोर: ${score}/${data.length}\n🌐 टेस्ट लिंक: https://akanand854318-ux.github.io/`;
            document.getElementById('share-wa-btn').href = `https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`;
        }
    </script>
</body>
</html>
